
<mat-dialog-content>
  <div class="container-fluid bckimg">
    <div class="row">
     
      <div class="col-md-4">       
       
      </div>
      <div class="col-md-8 ">       
        <h1>Get a Call Back  <button mat-button mat-dialog-close style="float: right;"><mat-icon>cancel</mat-icon></button> </h1>
        
        <form [formGroup]="registerForm" (submit)="onSubmit()" class="example-form">
        <div class="form-group">
          <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput #firstName  placeholder="Name" formControlName="from_Name">
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field>
            <mat-label>Enter a date range</mat-label>
            <mat-date-range-input [rangePicker]="picker">
              <input matStartDate formControlName="start_date" placeholder="Start date">
              <input matEndDate formControlName ="end_date" placeholder="End date">
            </mat-date-range-input>
            <mat-hint>MM/DD/YYYY – MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-date-range-picker #picker></mat-date-range-picker>
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="fill">
            <mat-label>Country</mat-label>
            <mat-select formControlName="from_contact" [(value)]="selected">        
              <mat-option *ngFor="let c of countryList" value="{{c.name}}">{{c.name}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="fill">
            <mat-label>No. of Person</mat-label>
            <input matInput formControlName="Noofperson"  placeholder="No. of Person">
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="fill">
            <mat-label>Contact</mat-label>
            <input matInput #contact  placeholder="Contact" formControlName="from_contact">
          </mat-form-field>
        </div>
        <div class="form-group">
          <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput #email placeholder="Email" formControlName="from_email" type="email">
          </mat-form-field> 
        </div>      
        <div class="form-group">

        </div>    
        
        <!-- <div class="form-group">
          <mat-form-field appearance="fill">
            <mat-label>Other Details</mat-label>
            <textarea matInput  placeholder="Other Details" formControlName="from_Otherdetails"></textarea>          
          </mat-form-field> 
        </div>  -->
        <button mat-raised-button color="accent" type="button" (click)="onSubmit()">Submit</button> &nbsp; &nbsp; &nbsp;
        <button mat-raised-button mat-dialog-close (click)="oncancel()">Close</button>         
      </form>
      </div>
      
    </div>
  </div>
</mat-dialog-content>
